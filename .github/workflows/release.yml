name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail

          archive="booxgestures.koplugin.zip"
          git archive \
            --format=zip \
            --prefix=booxgestures.koplugin/ \
            --output="$archive" \
            "$GITHUB_SHA" \
            README.md _meta.lua main.lua silentlight.lua

          unzip -t "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          assets=(
            booxgestures.koplugin.zip
            booxgestures.koplugin.zip.sha256
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi
